# =====================================================================
# Database Configuration for VMSS
# =====================================================================

# Database Type: mysql or h2 (h2 provides zero-setup in-memory/file storage)
db.type=mysql

# MySQL Configuration
db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/vehicle_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.mysql.user=root
db.mysql.password=root

# H2 Fallback Configuration (Automatically used if MySQL connection fails or during unit tests)
db.h2.driver=org.h2.Driver
db.h2.url=jdbc:h2:mem:vehicle_management_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
db.h2.user=sa
db.h2.password=

# Connection Pool Settings
db.pool.maxConnections=15
db.pool.timeoutSeconds=30
